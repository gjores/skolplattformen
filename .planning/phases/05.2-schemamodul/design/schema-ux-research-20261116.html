<div id="schema-ux" lang="sv" aria-label="Principskiss för schemaläggning med exempeldata"></div>
<style>
#schema-ux{--sp-bg:#f7f8fa;--sp-ink:#202b3b;--sp-card:#fff;--sp-muted:#657185;--sp-line:#e3e7ee;--sp-primary:#365ce6;--sp-accent:#edf1ff;--sp-accent-ink:#2d4cc1;--sp-secondary:#edf0f6;--sp-success:#e4f3e9;--sp-success-ink:#29704c;--sp-warning:#f6efe2;--sp-warning-ink:#86601f;--sp-error:#fbeeee;--sp-error-ink:#b83737;--sp-focus:#607fed;--sp-radius:.65rem;color-scheme:light;container-type:inline-size;font:400 1rem/1.5 Geist,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--sp-ink);background:var(--sp-bg);border:1px solid var(--sp-line);border-radius:12px;overflow-wrap:anywhere}
#schema-ux *{box-sizing:border-box}#schema-ux [hidden]{display:none!important}#schema-ux h1,#schema-ux h2,#schema-ux h3,#schema-ux p{margin:0}#schema-ux h1{font-size:1.8rem;line-height:1.2;font-weight:550;letter-spacing:-.055em}#schema-ux h2{font-size:1rem;font-weight:600;letter-spacing:-.025em}#schema-ux h3{font-size:.9375rem;font-weight:600}#schema-ux small,.sp-small{font-size:.8125rem}#schema-ux .sp-muted{color:var(--sp-muted)}#schema-ux .sp-top{padding:16px 24px 12px;background:var(--sp-card);border-bottom:1px solid var(--sp-line);border-radius:12px 12px 0 0}#schema-ux .sp-kicker{padding-right:100px;font-size:.75rem;color:var(--sp-muted);margin-bottom:12px}#schema-ux .sp-header,#schema-ux .sp-row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}#schema-ux .sp-header{align-items:flex-start}#schema-ux .sp-header p{margin-top:4px;font-size:.875rem;color:var(--sp-muted)}#schema-ux button,#schema-ux select,#schema-ux input{font:500 .875rem/1.4 Geist,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--sp-ink)}#schema-ux button{min-height:44px;max-width:100%;padding:8px 12px;background:var(--sp-card);border:1px solid var(--sp-line);border-radius:var(--sp-radius);white-space:normal;cursor:pointer}#schema-ux button:hover{background:var(--sp-secondary)}#schema-ux button:disabled{opacity:.6;cursor:default}#schema-ux button.sp-primary{background:var(--sp-primary);color:var(--sp-card);border-color:var(--sp-primary)}#schema-ux button:focus-visible,#schema-ux input:focus-visible,#schema-ux select:focus-visible{outline:3px solid var(--sp-focus);outline-offset:3px}#schema-ux .sp-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}#schema-ux nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}#schema-ux nav button{border-color:transparent;background:transparent}#schema-ux nav button[aria-current=page]{background:var(--sp-accent);color:var(--sp-accent-ink);border-color:var(--sp-primary)}#schema-ux .sp-body{padding:24px}#schema-ux .sp-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,30%);gap:20px;align-items:start}#schema-ux .sp-card{background:var(--sp-card);border:1px solid var(--sp-line);border-radius:12px;padding:20px;min-width:0}#schema-ux .sp-stack{display:grid;gap:16px;min-width:0}#schema-ux .sp-card>p+*,#schema-ux .sp-card>h2+*,#schema-ux .sp-card>h3+*{margin-top:12px}#schema-ux .sp-status{display:inline-block;padding:4px 8px;border-radius:5px;font-size:.75rem;font-weight:500;background:var(--sp-secondary)}#schema-ux .sp-status.ok{color:var(--sp-success-ink);background:var(--sp-success)}#schema-ux .sp-status.warn{color:var(--sp-warning-ink);background:var(--sp-warning)}#schema-ux .sp-status.error{color:var(--sp-error-ink);background:var(--sp-error)}#schema-ux .sp-notice{padding:12px 16px;background:var(--sp-warning);color:var(--sp-warning-ink);border-radius:var(--sp-radius);font-size:.875rem;margin-bottom:16px}#schema-ux .sp-notice p+*{margin-top:8px}#schema-ux .sp-tasks{list-style:none;margin:16px 0 0;padding:0}#schema-ux .sp-tasks>li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-top:1px solid var(--sp-line);padding:12px 0}#schema-ux .sp-task{border:0;text-align:left;padding:4px 0;background:transparent;display:grid;gap:4px}#schema-ux .sp-task strong{font-weight:500}#schema-ux .sp-task small{color:var(--sp-muted);font-weight:400}#schema-ux .sp-note{font-size:.875rem;color:var(--sp-muted)}#schema-ux .sp-check{display:flex;gap:12px;align-items:flex-start;margin:16px 0;font-size:.875rem}#schema-ux .sp-check input{width:20px;height:20px;flex-shrink:0;margin-top:2px;accent-color:var(--sp-primary)}#schema-ux .sp-link{color:var(--sp-accent-ink);border:0;background:transparent;text-decoration:underline;text-underline-offset:3px;padding:4px 0;text-align:left}#schema-ux .sp-divider{border:0;border-top:1px solid var(--sp-line);margin:16px 0}#schema-ux .sp-back{margin-bottom:12px}#schema-ux .sp-facts{margin:12px 0 0;display:grid;gap:12px;font-size:.875rem}#schema-ux .sp-facts dt{color:var(--sp-muted)}#schema-ux .sp-facts dd{margin:2px 0 0}#schema-ux .sp-table-frame{overflow:auto;margin:12px 0}#schema-ux table{border-collapse:collapse;width:100%;font-size:.875rem}#schema-ux th,#schema-ux td{border-bottom:1px solid var(--sp-line);padding:12px 8px;text-align:left;vertical-align:top}#schema-ux th{font-weight:500;color:var(--sp-muted)}#schema-ux td input{width:20px;height:20px;accent-color:var(--sp-primary)}#schema-ux .sp-room{padding:12px 0;border-top:1px solid var(--sp-line);font-size:.875rem}#schema-ux .sp-room p{margin-top:4px;color:var(--sp-muted)}#schema-ux .sp-bands{display:grid;gap:8px;margin-top:16px;font-size:.875rem}#schema-ux .sp-band{padding:8px 12px;background:var(--sp-secondary);border-radius:7px}#schema-ux .sp-band.ok{background:var(--sp-success);color:var(--sp-success-ink)}#schema-ux .sp-band.warn{background:var(--sp-warning);color:var(--sp-warning-ink)}#schema-ux .sp-board{display:grid;grid-template-columns:2.5rem repeat(5,minmax(0,1fr));gap:6px;margin-top:16px;font-size:.8125rem}#schema-ux .sp-dayname{text-align:center;font-weight:500;min-height:32px}#schema-ux .sp-time,#schema-ux .sp-day{position:relative;height:30rem;min-width:0}#schema-ux .sp-time span{position:absolute;font-size:.75rem;color:var(--sp-muted)}#schema-ux .sp-day{background:repeating-linear-gradient(to bottom,var(--sp-card) 0,var(--sp-card) calc(3.75rem - 1px),var(--sp-line) calc(3.75rem - 1px),var(--sp-line) 3.75rem);border:1px solid var(--sp-line);border-radius:7px}#schema-ux button.sp-lesson{position:absolute;top:calc(var(--minute) * .0625rem);height:5.625rem;left:3px;right:3px;min-height:0;padding:8px 6px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:2px;text-align:left;background:var(--sp-accent);border-color:var(--sp-line);font-size:.8125rem;overflow:visible}#schema-ux button.sp-lesson.selected{border:2px solid var(--sp-primary)}#schema-ux button.sp-lesson.missing{background:var(--sp-warning);border-color:var(--sp-warning-ink)}#schema-ux .sp-lesson time{font-size:.75rem;color:var(--sp-muted)}#schema-ux .sp-lesson strong{font-weight:500;line-height:1.3}#schema-ux .sp-lesson span{font-size:.75rem}#schema-ux .sp-screen-title{display:grid;gap:4px}#schema-ux .sp-footer{border-top:1px solid var(--sp-line);padding:12px 24px;font-size:.8125rem;color:var(--sp-muted)}#schema-ux .sp-announcement{margin-top:12px;font-size:.875rem;color:var(--sp-success-ink)}#schema-ux .sp-review-row{padding:16px 0;border-top:1px solid var(--sp-line);display:grid;gap:8px}#schema-ux .sp-change{padding:12px;background:var(--sp-accent);border-radius:var(--sp-radius);margin:12px 0;font-size:.875rem}
@container(max-width:52rem){#schema-ux .sp-layout{grid-template-columns:minmax(0,1fr)}#schema-ux .sp-body{padding:16px}#schema-ux .sp-top{padding:16px}#schema-ux .sp-footer{padding:12px 16px}}
@container(max-width:34rem){#schema-ux .sp-tasks>li{grid-template-columns:minmax(0,1fr)}#schema-ux .sp-tasks>li>.sp-status{justify-self:start}#schema-ux .sp-board{display:block}#schema-ux .sp-board>.sp-time{display:none}#schema-ux .sp-dayname{text-align:left;min-height:0;margin-top:16px;margin-bottom:8px}#schema-ux .sp-day{height:auto;padding:8px;background:var(--sp-card);display:grid;gap:8px}#schema-ux button.sp-lesson{position:static;height:auto;min-height:80px;margin:0}#schema-ux .sp-header h1{font-size:1.5rem}}
</style>
<script>
(()=>{
  const root=document.getElementById('schema-ux');
  const initial={view:'prepare',section:'overview',table:false,hallDraft:false,hallAllowed:false,hallReviewed:false,assigned:false,selected:'pe',pinned:null,preview:false,selectedRoom:false,undo:false,message:''};
  let state={...initial};
  const days=['Måndag','Tisdag','Onsdag','Torsdag','Fredag'];
  const lessons=[{id:'math',title:'Matematik',group:'Grupp A',day:0,minute:90,time:'09:30–11:00',room:'A101'}, {id:'language',title:'Språkblock',group:'Grupp A och B',day:1,minute:60,time:'09:00–10:30',room:'201 · 202'}, {id:'pe',title:'Idrott',group:'Grupp A',day:2,minute:30,time:'08:30–10:00',room:null}, {id:'science',title:'Naturkunskap',group:'Grupp B',day:3,minute:180,time:'11:00–12:30',room:'Laborationssal'}, {id:'swedish',title:'Svenska',group:'Grupp A',day:4,minute:90,time:'09:30–11:00',room:'A101'}];
  const sections=[['basis','Underlag','Kalender, timplan och tjänstefördelning'],['lessons','Lektioner och block','Lektionsantal och samtidiga undervisningar'],['rooms','Salar','Tillgänglighet, kapacitet och salskrav'],['rules','Regler och önskemål','Skoldag, lunch, marginaler och prioriteringar'],['check','Kontrollera underlaget','Saknade uppgifter och motstridiga villkor']];
  const button=(label,action,opts={})=>`<button type="button" data-action="${action}" data-focus="${opts.focus||action}" ${opts.disabled?'disabled':''} class="${opts.primary?'sp-primary':''}">${label}</button>`;
  const tag=(text,kind='')=>`<span class="sp-status ${kind}">${text}</span>`;
  const room=lesson=>lesson.id==='pe'?(state.assigned?'Hall B':'Sal saknas'):lesson.room;
  function remember(){try{window.openai?.setWidgetState?.({modelContent:{mockup:'schema-ux',view:state.view,section:state.section,allowHallB:state.hallAllowed,roomAssigned:state.assigned},privateContent:{version:1,...state}})?.catch(()=>{});}catch{}}
  function adopt(saved){if(!saved||saved.version!==1)return;const n={...initial};for(const k of Object.keys(initial))if(typeof saved[k]===typeof initial[k])n[k]=saved[k];if(['prepare','schedule','review'].includes(saved.view))n.view=saved.view;if(['overview',...sections.map(x=>x[0])].includes(saved.section))n.section=saved.section;n.pinned=['pe','language','math','science','swedish'].includes(saved.pinned)?saved.pinned:null;n.message='';state=n;}
  function feedback(){return `<aside class="sp-card sp-stack" aria-label="Återkoppling på förutsättningarna"><div class="sp-row"><h2>Förutsättningar just nu</h2>${tag(state.hallDraft!==state.hallAllowed?'Ändrat · Inte kontrollerat':!state.hallReviewed?'Behöver genomgång':state.hallAllowed?'Begränsat utrymme':'Salsproblem',state.hallReviewed&&!state.hallAllowed&&state.hallDraft===state.hallAllowed?'error':'warn')}</div><p class="sp-note">${state.hallDraft!==state.hallAllowed?'Beskedet gäller det tidigare sparade salskravet. Kontrollera den nya ändringen.':'Bedömning i exempeldata. Hela schemats kvalitet är ännu inte prövad.'}</p><div><h3>${state.hallReviewed&&state.hallAllowed?'Ett salskrav har fått fler alternativ':state.hallReviewed?'Inget tillåtet rum på vald tid':'Gå igenom idrottens salskrav'}</h3><p class="sp-note">${state.hallReviewed&&state.hallAllowed?'2 tillåtna hallar, jämfört med 1 före ändringen. Hall B är ledig på den valda tiden.':'Hall A är stängd onsdag 08:30–10:00. Hall B passar gruppen men ingår inte i salskravet.'}</p></div><hr class="sp-divider"><div><h3>Språkblockets samtidighet</h3><p class="sp-note">Två grupper behöver varsin sal på samma tid. Blocket har 2 gemensamma starttider i exemplet.</p></div>${button('Se språkblocket','block')}<p class="sp-note">Obligatoriska krav ligger fast. Fler alternativ betyder större valfrihet.</p></aside>`;}
  function overview(){return `<section class="sp-card"><div class="sp-row"><h2>Förbered schemat</h2>${tag(`${state.hallReviewed&&state.hallDraft===state.hallAllowed?4:3} av 5 områden genomgångna`)}</div><p class="sp-note">Börja där uppgifter saknas. Du kan öppna områdena i valfri ordning.</p><ul class="sp-tasks">${sections.map(([key,title,desc])=>`<li><button type="button" class="sp-task" data-action="section:${key}" data-focus="section:${key}"><strong>${title}</strong><small>${desc}</small></button>${tag(key==='rooms'?(state.hallDraft!==state.hallAllowed?'Ändrat sedan genomgången':state.hallReviewed?'Genomgånget':'1 fråga kvar'):key==='check'?'Inte prövat':'Genomgånget',key==='rooms'&&(!state.hallReviewed||state.hallDraft!==state.hallAllowed)?'warn':key==='check'?'':'ok')}</li>`).join('')}</ul><hr class="sp-divider">${button(state.hallReviewed?'Kontrollera nästa område':'Gå igenom salskraven',state.hallReviewed?'section:check':'section:rooms',{primary:true})}</section>`;}
  function rooms(){return `<section class="sp-card"><div class="sp-row"><h2>Salskrav för idrott</h2>${button(state.table?'Visa som formulär':'Visa som tabell','table')}</div><p class="sp-note">Grupp A · 24 elever · onsdag 08:30–10:00. Kräver idrottshall med minst 24 platser.</p>${state.table?`<div class="sp-table-frame"><table><caption class="sp-note">Samma salskrav som i formuläret</caption><thead><tr><th>Välj</th><th>Sal</th><th>Platser</th><th>På vald tid</th><th>Tillåten</th></tr></thead><tbody><tr><td>—</td><th scope="row">Hall A</th><td>30</td><td>Stängd</td><td>Ja</td></tr><tr><td><input id="sp-select-room" data-focus="sp-select-room" type="checkbox" ${state.selectedRoom?'checked':''} aria-label="Välj Hall B"></td><th scope="row">Hall B</th><td>30</td><td>Ledig</td><td>${state.hallDraft?'Ja':'Nej'}</td></tr></tbody></table></div><div class="sp-actions">${button('Lägg till vald sal i salskravet','bulk',{disabled:!state.selectedRoom})}${button('Ta bort vald sal ur salskravet','bulk-remove',{disabled:!state.selectedRoom})}</div>`:`<div class="sp-room"><strong>Hall A</strong>${tag('Stängd på vald tid','warn')}<p>30 platser · Idrottshall · Tillåten sal</p></div><label class="sp-check"><input id="sp-allow-room" data-focus="sp-allow-room" type="checkbox" ${state.hallDraft?'checked':''}><span><strong>Tillåt även Hall B</strong><br>30 platser · Idrottshall · Ledig onsdag 08:30–10:00</span></label>`}<hr class="sp-divider"><p class="sp-note">${state.hallDraft!==state.hallAllowed?'Ändrat salskrav. Kontrollera valet innan det används.':'Detta ändrar tillåtna salar. De redan lagda passtiderna ligger kvar.'}</p><div class="sp-actions">${button('Spara salskrav och kontrollera','save-rooms',{primary:true})}${button('Tillbaka till översikten','section:overview')}</div></section>`;}
  function area(){if(state.section==='overview')return overview();if(state.section==='rooms')return rooms();let content='';
    if(state.section==='basis')content=`<h2>Underlaget är genomgånget</h2><dl class="sp-facts"><div><dt>Läsårskalender</dt><dd>Version 3 · Fastställd</dd></div><div><dt>Timplan</dt><dd>Version 2 · Fastställd</dd></div><div><dt>Tjänstefördelning</dt><dd>Version 5 · Underlag för detta exempelutkast</dd></div></dl><hr class="sp-divider"><p class="sp-note">En ändrad källa ska visa vad som skiljer innan den används i schemat.</p>`;
    if(state.section==='lessons')content=`<h2>Lektioner och block</h2><p class="sp-note">Tid räknas över hela läsåret. Gemensamt veckomönster för HT och VT.</p><div class="sp-review-row"><strong>Språkblock · Eget samtidighetsblock</strong><span>Två undervisningar · samma start och slut · hela läsåret</span><dl class="sp-facts"><div><dt>Grupp A</dt><dd>Lärare A · Sal 201 · 90 minuter</dd></div><div><dt>Grupp B</dt><dd>Lärare B · Sal 202 · 90 minuter</dd></div></dl>${button('Visa blocket i schemat','show-block')}</div><div class="sp-review-row"><strong>Matematik · Grupp A</strong><span>3 pass per vecka · Årsbehov från timplanen</span><span class="sp-note">Grupp B kan ha en annan lektionsfördelning.</span></div>`;
    if(state.section==='rules')content=`<h2>Regler och önskemål</h2><div class="sp-review-row"><strong>Obligatoriska krav</strong><span>Skoldag 08:00–16:00 · Lunchutrymme · Resurser får inte dubbelbokas</span></div><div class="sp-review-row"><strong>Prioriterade önskemål</strong><span>Undvik håltid för elever · Undvik sena pass · Behåll veckomönstret</span></div><p class="sp-note">Källan och eventuella gruppundantag ska synas vid varje regel.</p>`;
    if(state.section==='check')content=`<h2>Kontrollera underlaget</h2><div class="sp-review-row">${tag(state.hallReviewed?'Salskravet genomgånget':'Salskrav återstår',state.hallReviewed?'ok':'warn')}<span>Behörighet, grupper, årsbehov, samtidighet och tillgängliga resurser ska kontrolleras tillsammans.</span></div><p class="sp-note">En tom lista med upptäckta hinder betyder inte att ett komplett schema redan är prövat.</p><hr class="sp-divider">${button('Öppna exempelutkastet','view:schedule',{primary:true})}`;
    return `<section class="sp-card sp-stack">${button('Alla förberedelseområden','section:overview')}${content}</section>`;
  }
  function inspector(){const id=state.pinned||state.selected,l=lessons.find(x=>x.id===id)||lessons[2];if(state.preview)return `<aside class="sp-card sp-stack" aria-label="Granska salbyte"><h2>Granska salbytet</h2>${tag('Förslag · Inte genomfört')}<p>Idrott · Grupp A<br>Onsdag 08:30–10:00</p><div class="sp-change"><strong>Sal saknas → Hall B</strong><br>1 salbyte · 0 tidsflyttar<br>Övriga pass behåller sina placeringar.</div><p class="sp-note">Hall B rymmer gruppen och är ledig under hela passet i exempeldata.</p>${button('Använd förslaget','apply',{primary:true})}${button('Avbryt förslaget','cancel-preview')}</aside>`;
    return `<aside class="sp-card sp-stack" aria-label="Detaljer för valt pass"><div class="sp-row"><h2>${l.title}</h2>${button(state.pinned?'Lossa panelen':'Fäst panelen','pin')}</div><p class="sp-note">${l.group}${state.pinned?' · Panelen är fäst':''}</p><dl class="sp-facts"><div><dt>Grundschema</dt><dd>${days[l.day]} ${l.time} · HT och VT</dd></div><div><dt>Sal</dt><dd>${room(l)}</dd></div></dl>${l.id==='pe'?`<div class="sp-bands"><div class="sp-band warn">Hall A · Stängd på vald tid</div><div class="sp-band ${state.hallAllowed?'ok':''}">Hall B · ${state.hallAllowed?'Lämplig och ledig':'Lämplig men inte tillåten'}</div></div>${state.assigned?tag(state.hallAllowed?'Hall B tilldelad':'Tilldelad sal bryter mot salskravet',state.hallAllowed?'ok':'error'):button('Granska salbyte utan tidsflytt','preview',{primary:true,disabled:!state.hallAllowed||state.hallDraft!==state.hallAllowed})}${!state.hallAllowed?button('Se över salskravet','edit-room'):''}`:l.id==='language'?`<p class="sp-note">Blocket flyttas tillsammans. Grupp A och B behåller sina egna lärare och salar.</p>${button('Se blockets förutsättningar','block')}`:`<p class="sp-note">Passet behåller sin tid när ett annat pass får ny sal.</p>${button('Visa idrotten som saknar sal','show-pe')}`}<hr class="sp-divider"><h3>Sammanhängande möjlighetsfält</h3><div class="sp-bands"><div class="sp-band ok">Illustration · Möjliga starter</div><div class="sp-band warn">Illustration · Önskemål påverkas</div></div><p class="sp-note">Sammanhängande fält. Den exakta starttidens skäl visas i panelen.</p></aside>`;}
  function schedule(){return `<div class="sp-stack"><div class="sp-screen-title"><h2>Lägg schema</h2><p class="sp-note">Grundschema · Hela läsåret · 5 exemplarpass</p></div>${state.hallDraft!==state.hallAllowed?`<div class="sp-notice"><p>Salskravet är ändrat. Kontrollera det nya valet före ett placeringsförslag.</p>${button('Öppna salskravet','edit-room')}</div>`:!state.assigned||!state.hallAllowed?`<div class="sp-notice"><div class="sp-row"><span>${state.assigned?'1 pass har en sal som inte längre tillåts.':'1 pass saknar sal.'} Tiderna ligger kvar.</span>${button('Visa passet','show-pe')}</div></div>`:''}<div class="sp-layout"><section class="sp-card" aria-label="Veckans grundmönster"><div class="sp-row"><h2>Gemensamt för HT och VT</h2>${tag('Vecka')}</div><div class="sp-board"><div></div>${days.map(d=>`<div class="sp-dayname">${d}</div>`).join('')}<div class="sp-time">${[8,10,12,14].map((h,i)=>`<span style="top:${i*7.5}rem">${h}:00</span>`).join('')}</div>${days.map((d,index)=>`<div class="sp-day" aria-label="${d}">${lessons.filter(l=>l.day===index).map(l=>`<button type="button" class="sp-lesson ${state.selected===l.id?'selected':''} ${l.id==='pe'&&(!state.assigned||!state.hallAllowed||state.hallDraft!==state.hallAllowed)?'missing':''}" style="--minute:${l.minute}" data-action="select:${l.id}" data-focus="select:${l.id}" aria-label="${l.title}, ${l.group}, ${d} ${l.time}, ${room(l)}"><time>${l.time}</time><strong>${l.title}</strong><span>${room(l)}</span></button>`).join('')}</div>`).join('')}</div></section>${inspector()}</div></div>`;}
  function review(){return `<div class="sp-layout"><section class="sp-card sp-stack"><h2>Granska exempelutkastet</h2><p class="sp-note">Samma utkast som i veckan. Här samlas sådant som ska följas upp.</p><div class="sp-review-row">${tag(state.hallDraft!==state.hallAllowed?'Salskrav ändrat · Kontroll återstår':state.assigned?(state.hallAllowed?'5 av 5 exemplarpass har sal':'1 pass bryter mot salskravet'):'1 exemplarpass saknar sal',state.assigned&&state.hallAllowed&&state.hallDraft===state.hallAllowed?'ok':'warn')}${!state.assigned?button('Visa idrotten','show-pe'):''}</div><div class="sp-review-row"><strong>Läsårets undervisningstid</strong><span>Gemensamt veckomönster för HT och VT. Årets minuter behöver kontrolleras mot verkliga tillfällen.</span>${tag('Inte beräknat i skissen')}</div><div class="sp-review-row"><strong>Önskemål och fullständighet</strong><span>Håltid, sena dagar, samtliga resurser och faktiska kalenderdatum behöver prövas i ett riktigt förslag.</span>${tag('Inte prövat')}</div><div class="sp-review-row"><strong>Senaste ändring</strong><span>${state.assigned?'Idrott fick Hall B. Ingen passtid ändrades.':'Inget salbyte genomfört.'}</span>${button('Tillbaka till schemat','view:schedule')}</div></section>${feedback()}</div>`;}
  function render(focus){const active=root.querySelector(':focus')?.getAttribute('data-focus');root.innerHTML=`<header class="sp-top"><p class="sp-kicker">skolplattform. / Schema · Principskiss med exempeldata</p><div class="sp-header"><div><h1>Schema 2027/28</h1><p>Exempelgymnasiet · Samma utkast i alla vyer</p></div><div class="sp-actions">${tag('Exempelutkast')}${button('Ångra salbyte','undo',{disabled:!state.undo})}</div></div><nav aria-label="Schemaarbetsytor">${[['prepare','Förbered'],['schedule','Lägg schema'],['review','Granska']].map(([key,label])=>`<button type="button" data-action="view:${key}" data-focus="view:${key}" ${state.view===key?'aria-current="page"':''}>${label}</button>`).join('')}</nav></header><div class="sp-body">${state.view==='prepare'?`<div class="sp-layout"><div>${area()}</div>${feedback()}</div>`:state.view==='schedule'?schedule():review()}<p class="sp-announcement" role="status">${state.message}</p></div><footer class="sp-footer">Illustration av arbetsflödet · Inga verkliga schemadata eller beräkningsresultat</footer>`;const key=focus||active;if(key)(root.querySelector(`[data-focus="${key}"]`)||root.querySelector(`[data-focus="view:${state.view}"]`))?.focus({preventScroll:true});}
  root.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;state.message='';if(a.startsWith('view:')){state.view=a.slice(5);state.preview=false;}else if(a.startsWith('section:')){state.section=a.slice(8);state.view='prepare';state.preview=false;}else if(a.startsWith('select:')){state.selected=a.slice(7);state.preview=false;}else if(a==='table')state.table=!state.table;else if(a==='bulk'){state.hallDraft=true;state.message='Hall B tillagd i salskravet. Spara och kontrollera valet.';}else if(a==='bulk-remove'){state.hallDraft=false;state.message='Hall B borttagen ur salskravet. Spara och kontrollera valet.';}else if(a==='save-rooms'){state.hallAllowed=state.hallDraft;state.hallReviewed=true;state.message=state.hallDraft?'Exempelkontroll: 2 tillåtna hallar. Tiderna är oförändrade.':'Exempelkontroll: Hall A är stängd. Ett lämpligt salsalternativ behövs.';}else if(a==='block'){state.view='prepare';state.section='lessons';state.preview=false;}else if(a==='show-block'){state.view='schedule';state.selected='language';state.pinned=null;}else if(a==='show-pe'){state.view='schedule';state.selected='pe';state.pinned=null;}else if(a==='edit-room'){state.view='prepare';state.section='rooms';}else if(a==='pin')state.pinned=state.pinned?null:state.selected;else if(a==='preview'){state.preview=true;}else if(a==='cancel-preview')state.preview=false;else if(a==='apply'){state.assigned=true;state.undo=true;state.preview=false;state.message='Salbytet är genomfört i skissen. Inga tider ändrades.';}else if(a==='undo'){state.assigned=false;state.undo=false;state.preview=false;state.message='Salbytet är ångrat. Salskravet ligger kvar.';}render();remember();});
  root.addEventListener('change',e=>{if(e.target.id==='sp-allow-room'){state.hallDraft=e.target.checked;state.message='Salskravet är ändrat men ännu inte kontrollerat.';render('sp-allow-room');remember();}else if(e.target.id==='sp-select-room'){state.selectedRoom=e.target.checked;render('sp-select-room');remember();}});
  adopt(window.openai?.widgetState?.privateContent);render();
  window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s){adopt(s);render();}});
})();
</script>
